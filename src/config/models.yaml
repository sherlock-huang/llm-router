# LLM Router 模型配置
# 配置 API Keys 和路由规则

models:
  stepfun:
    provider: stepfun
    model: step-3.5-flash
    max_tokens: 8192
    temperature: 0.7
    routing:
      keywords:
        - 代码
        - 写代码
        - function
        - def
        - class
        - import
        - debug
        - bug
        - 算法
        - 编程
        - python
        - javascript
        - java
        - rust
        - sql
        - api
        - 接口
      score: 0.95

  minimax:
    provider: minimax
    model: MiniMax-M2.7
    max_tokens: 4096
    temperature: 0.7
    routing:
      keywords:
        - 分析
        - 解释
        - 为什么
        - 理解
        - 推理
      score: 0.85

  ark:
    provider: bytedance
    model: doubao-seed-2.0-code
    max_tokens: 4096
    temperature: 0.7
    routing:
      keywords:
        - 创意
        - 写作
        - 写故事
        - 文案
        - 小说
        - 摘要
        - 总结
      score: 0.8

# 默认设置
defaults:
  timeout_ms: 60000
  max_retries: 2
  default_model: minimax
  enable_decomposition: true
  decomposition_threshold: high  # low/medium/high
